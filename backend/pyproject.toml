[project]
name = "mini-rag"
version = "0.1.0"
description = "A small, hand-written RAG for learning."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "numpy",
    "pypdf",
    "sentence-transformers",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
